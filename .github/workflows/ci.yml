name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml python-dotenv pytest
          pip install -e .

      - name: Verify import
        run: python -c "from workflow_kit.runtime.config import WorkflowConfig; print('import ok')"

      - name: Verify CLI entry point
        run: python -m workflow_kit --help

      - name: Run tests
        run: pytest tests/ -v --tb=short

  install-smoke:
    name: Install smoke test (pip from GitHub)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install from GitHub source (current commit)
        run: |
          pip install pyyaml python-dotenv
          pip install "git+https://github.com/${{ github.repository }}.git@${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Verify install
        run: |
          python -c "import workflow_kit; print('version:', workflow_kit.__version__)"
          python -m workflow_kit --help
